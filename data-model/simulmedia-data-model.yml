api: PlayerWON API
notes: >-
  Entity graph derived from the PlayerWON Unity SDK model classes. The PlayerWON
  API brokers rewarded-video ad opportunities inside free-to-play games: a game
  submits ClientDetails, receives an Opportunity (identified by a Receipt), plays
  the creative, and reports lifecycle events keyed by that Receipt.
