apis:
- name: PlayerWON API
  description: In-game rewarded-video ad API. A game server exchanges client credentials for a Bearer token, then requests ad opportunities for
    a player and reports the playback lifecycle (start, progress, complete, abort) so the player's reward is granted. OAuth2 client-credentials;
    JSON. Surfaced from the first-party PlayerWON SDK (no public OpenAPI is published).
  humanURL: https://www.playerwon.com
  baseURL: https://game.simulmedia-apis.com
