aid: simulmedia
name: Simulmedia
description: >-
  Simulmedia is a technology-driven television advertising company that helps
  advertisers, agencies, and growth marketers plan, buy, and measure campaigns
  across linear TV, connected TV (CTV), and games. Its products include the
  Performance TV media-buying service, the AI-powered TV+ media-buying platform,
  and Simulmedia Self-Serve. Through PlayerWON, Simulmedia operates an in-game
  rewarded-video engagement and monetization platform for free-to-play console
  and PC games, exposed to game developers through the PlayerWON API and a
  first-party Unity/Unreal SDK. Simulmedia is a portfolio company of Union Square
  Ventures. This profile was enriched by the API Evangelist pipeline from the
  company's public developer surface and the open-source PlayerWON SDK.
